<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SVC · Sistema de Ventas</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#1c1c1c">

<body>
<div id="login" class="login" hidden>
  <form class="login-card" id="loginForm">
    <img src="../assets/logo.svg" alt="" width="52" height="52">
    <h1>SVC</h1>
    <p class="muted">Sistema de Ventas Comprasuy</p>
    <label class="f">Email<input name="email" type="email" autocomplete="username" required></label>
    <label class="f">Contraseña<input name="password" type="password" autocomplete="current-password" required></label>
    <p class="login-err" id="loginErr" hidden></p>
    <button class="btn primary big">Entrar</button>
    <a class="small muted" href="../">← Volver al sitio</a>
  </form>
</div>
<div class="layout" id="shell" hidden>
  <aside class="side">
    <a class="brand" href="#/panel"><img src="../assets/logo.svg" alt=""><span>SVC<small>Sistema de Ventas Comprasuy</small></span></a>
    <a class="nav" href="#/hoy">📍 Hoy</a>
    <a class="nav" href="#/panel">📊 Panel</a>
    <a class="nav" href="#/venta">🛒 Nueva venta</a>
    <a class="nav" href="#/ventas">📋 Ventas</a>
    <a class="nav" href="#/productos">📦 Productos</a>
    <a class="nav" href="#/clientes">👥 Clientes</a>
    <a class="nav" href="#/rutas" data-roles="admin,supervisor">🗺️ Rutas</a>
    <a class="nav" href="#/jornada" data-roles="admin,supervisor">📅 Jornada</a>
    <a class="nav" href="#/comisiones">💰 Comisiones</a>
    <a class="nav" href="#/reportes">📈 Reportes</a>
    <a class="nav" href="#/config">⚙️ Configuración</a>
    <div class="grow"></div>
    <div class="who" id="who"></div>
    <a class="back" href="../">← Volver al sitio</a>
  </aside>
  <main class="main" id="view"></main>
</div>
<div id="modal-root"></div>
<script src="calc.js"></script>
<script src="app.js"></script>
<script src="terreno.js"></script>
<script src="perfil.js"></script>

</html>
